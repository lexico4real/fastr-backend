version: '3.8'

services:
  app:
    build:
      context: .
      target: development  # Switch to "production" for deployment
    container_name: fastr-backend
    ports:
      - '3000:3000'
    depends_on:
      fastr-db:
        condition: service_healthy
      fastr-cache-house:
        condition: service_healthy
      fastr-mongodb:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - fastr-network
    restart: unless-stopped
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    # For production, remove volumes and use:
    # command: ["dumb-init", "node", "dist/main.js"]

  fastr-db:
    image: postgres:15-alpine
    container_name: fastr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - fastr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "listen_addresses=*"]

  fastr-cache-house:
    image: redis:7-alpine
    container_name: fastr-redis
    restart: unless-stopped
    networks:
      - fastr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastr-mongodb:
    image: mongo:7.0
    container_name: fastr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - fastr-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fastr-network:
    driver: bridge

volumes:
  db-data:
  mongo-data: